name: Build usb_diag PRX

on:
  push:
    branches: [ "ci/usb-diag-prx" ]
    paths:
      - "ps4/usb_diag/**"
      - ".github/workflows/build-usb-diag-prx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git curl jq

      - name: Checkout GoldHEN plugin template repository
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_Repository
          path: upstream/plugins
          submodules: recursive

      - name: Checkout GoldHEN Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: GoldHEN/GoldHEN_Plugins_SDK
          path: upstream/goldhen-sdk
          submodules: recursive

      - name: Install OpenOrbis PS4 Toolchain
        shell: bash
        run: |
          set -euxo pipefail
          TAG="$(curl -fsSL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | jq -r .tag_name)"
          test -n "$TAG" && test "$TAG" != "null"
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${TAG}/${TAG}.tar.gz" -o "$RUNNER_TEMP/openorbis/toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis/toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis"
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/openorbis" >> "$GITHUB_ENV"
          echo "GOLDHEN_SDK=$GITHUB_WORKSPACE/upstream/goldhen-sdk" >> "$GITHUB_ENV"
          find "$RUNNER_TEMP/openorbis/bin" -type f -exec chmod +x {} +

      - name: Build GoldHEN Plugin SDK library
        run: make -C "$GITHUB_WORKSPACE/upstream/goldhen-sdk" PRINTF=1

      - name: Install usb_diag source into official plugin_template
        run: |
          cp "$GITHUB_WORKSPACE/ps4/usb_diag/source/main.c" \
             "$GITHUB_WORKSPACE/upstream/plugins/plugin_src/plugin_template/source/main.c"

      - name: Compile PRX with official plugin_template Makefile
        working-directory: upstream/plugins/plugin_src/plugin_template
        run: |
          set -euxo pipefail
          make clean
          make PRINTF=1
          find ../../bin/plugins -type f -name '*.prx' -print -exec file {} \;

      - name: Verify PRX output
        run: |
          set -euxo pipefail
          PRX="$GITHUB_WORKSPACE/upstream/plugins/bin/plugins/prx_final/plugin_template.prx"
          test -s "$PRX"
          file "$PRX"
          sha256sum "$PRX"
          cp "$PRX" "$GITHUB_WORKSPACE/usb_diag.prx"

      - name: Upload real PRX build
        uses: actions/upload-artifact@v4
        with:
          name: usb_diag-prx
          path: usb_diag.prx
          if-no-files-found: error
          retention-days: 14
